name: Android CI
on:
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build a signed release APK"
        required: true
        type: boolean
        default: false
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        env:
          OPENCLONE_KEYSTORE_BASE64: ${{ secrets.OPENCLONE_KEYSTORE_BASE64 }}
          OPENCLONE_KEYSTORE_PASSWORD: ${{ secrets.OPENCLONE_KEYSTORE_PASSWORD }}
          OPENCLONE_KEY_ALIAS: ${{ secrets.OPENCLONE_KEY_ALIAS }}
          OPENCLONE_KEY_PASSWORD: ${{ secrets.OPENCLONE_KEY_PASSWORD }}
          OPENCLONE_VERSION_CODE: ${{ github.run_number }}
        run: gradle testDebugUnitTest lintDebug assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openclone-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Verify release signing secrets
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.build_release
        env:
          OPENCLONE_KEYSTORE_BASE64: ${{ secrets.OPENCLONE_KEYSTORE_BASE64 }}
          OPENCLONE_KEYSTORE_PASSWORD: ${{ secrets.OPENCLONE_KEYSTORE_PASSWORD }}
          OPENCLONE_KEY_ALIAS: ${{ secrets.OPENCLONE_KEY_ALIAS }}
          OPENCLONE_KEY_PASSWORD: ${{ secrets.OPENCLONE_KEY_PASSWORD }}
        run: |
          test -n "$OPENCLONE_KEYSTORE_BASE64" || (echo "Missing OPENCLONE_KEYSTORE_BASE64" && exit 1)
          test -n "$OPENCLONE_KEYSTORE_PASSWORD" || (echo "Missing OPENCLONE_KEYSTORE_PASSWORD" && exit 1)
          test -n "$OPENCLONE_KEY_ALIAS" || (echo "Missing OPENCLONE_KEY_ALIAS" && exit 1)
          test -n "$OPENCLONE_KEY_PASSWORD" || (echo "Missing OPENCLONE_KEY_PASSWORD" && exit 1)
      - name: Build signed release APK
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.build_release
        env:
          OPENCLONE_KEYSTORE_BASE64: ${{ secrets.OPENCLONE_KEYSTORE_BASE64 }}
          OPENCLONE_KEYSTORE_PASSWORD: ${{ secrets.OPENCLONE_KEYSTORE_PASSWORD }}
          OPENCLONE_KEY_ALIAS: ${{ secrets.OPENCLONE_KEY_ALIAS }}
          OPENCLONE_KEY_PASSWORD: ${{ secrets.OPENCLONE_KEY_PASSWORD }}
          OPENCLONE_VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease
      - name: Upload signed release APK
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.build_release
        uses: actions/upload-artifact@v4
        with:
          name: openclone-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
  android-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 34, 35]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Run Android compatibility tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -wipe-data
          script: |
            set -o pipefail
            if gradle connectedDebugAndroidTest; then
              exit 0
            fi

            echo "Instrumentation run failed; rebooting the emulator once to recover transient package-manager/ADB failures."
            adb wait-for-device
            adb reboot
            adb wait-for-device
            for attempt in $(seq 1 90); do
              if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
                break
              fi
              sleep 5
            done
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            gradle connectedDebugAndroidTest
